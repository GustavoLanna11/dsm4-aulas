<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Filmes</title>
</head>
<body>
    {% extends 'base.html' %}

    {% block content %}
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- Card do formulário -->
                <div class="card shadow-lg mb-4" style="background-color:#383838; color:#f5f5f5; border:1px solid #4a4a4a;">
                    <div class="card-body">
                        <h1 class="card-title text-center mb-3">🎬 Cadastro de Filmes</h1>
                        <hr>
                        <form action="{{url_for('newmovie')}}" method="POST" class="row g-3">
                            <div class="col-md-6">
                                <label for="title" class="form-label">Título</label>
                                <input type="text" name="title" class="form-control" required style="background-color:#2c2c2c; color:#f5f5f5; border:1px solid #4a4a4a;">
                            </div>
                            <div class="col-md-6">
                                <label for="year" class="form-label">Ano</label>
                                <input type="number" name="year" class="form-control" required style="background-color:#2c2c2c; color:#f5f5f5; border:1px solid #4a4a4a;">
                            </div>
                            <div class="col-md-6">
                                <label for="category" class="form-label">Categoria</label>
                                <input type="text" name="category" class="form-control" required style="background-color:#2c2c2c; color:#f5f5f5; border:1px solid #4a4a4a;">
                            </div>
                            <div class="col-md-12">
                                <label for="sinopse" class="form-label">Sinopse</label>
                                <textarea name="sinopse" class="form-control" rows="3" style="background-color:#2c2c2c; color:#f5f5f5; border:1px solid #4a4a4a;"></textarea>
                            </div>
                            <div class="col-12 text-center">
                                <button type="submit" class="btn btn-primary btn-lg shadow-sm mt-3" style="background-color:purple; border-color:purple; color:#f5f5f5;">Cadastrar</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Card da tabela -->
                <div class="card shadow-lg" style="background-color:#383838; color:#f5f5f5; border:1px solid #4a4a4a;">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-3">📑 Filmes Cadastrados</h2>
                        <hr>
                        <div class="table-responsive">
                            <table class="table table-striped table-hover text-center align-middle" style="color:#f5f5f5;">
                                <thead style="background-color:#111;">
                                    <tr>
                                        <th>Título</th>
                                        <th>Ano</th>
                                        <th>Categoria</th>
                                        <th>Sinopse</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for movie in movielist %}
                                    <tr style="background-color:#2c2c2c;">
                                        <td>{{movie.Título}}</td>
                                        <td>{{movie.Ano}}</td>
                                        <td>{{movie.Categoria}}</td>
                                        <td>{{movie.Sinopse}}</td>
                                    </tr>
                                    {% else %}
                                    <tr>
                                        <td colspan="4" class="text-muted">Nenhum filme cadastrado ainda.</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    {% endblock content %}
</body>


</html>
