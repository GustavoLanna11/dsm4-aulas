{% extends 'base.html' %}

{% block content %}
<style>
    .text-purple {
        color: #bb86fc !important;
    }
</style>

<div class="container mt-5 text-white bg-dark p-4 rounded shadow col-md-6">
    <h3 class="text-purple text-center mb-4">Editar Autor</h3>

    <form action="{{ url_for('autoredit', id=autor.id) }}" method="POST" class="row g-3">

        <div class="col-12">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" name="nome" id="nome" class="form-control bg-dark text-white border-secondary" value="{{ autor.nome }}" required>
        </div>

        <div class="col-md-6">
            <label for="idade" class="form-label">Idade</label>
            <input type="number" name="idade" id="idade" class="form-control bg-dark text-white border-secondary" value="{{ autor.idade }}" required>
        </div>

        <div class="col-md-6">
            <label for="genero" class="form-label">Gênero</label>
            <input type="text" name="genero" id="genero" class="form-control bg-dark text-white border-secondary" value="{{ autor.genero }}" required>
        </div>

        <div class="col-12">
            <label for="nacionalidade" class="form-label">Nacionalidade</label>
            <input type="text" name="nacionalidade" id="nacionalidade" class="form-control bg-dark text-white border-secondary" value="{{ autor.nacionalidade }}" required>
        </div>

        <div class="col-12 d-flex justify-content-between">
            <input type="submit" value="Salvar Alterações" class="btn btn-warning"
                   onclick="return confirm('Confirma as alterações?')">
            <a href="{{ url_for('autoresestoque') }}" class="btn btn-secondary">Cancelar</a>
        </div>

    </form>
</div>
{% endblock %}
