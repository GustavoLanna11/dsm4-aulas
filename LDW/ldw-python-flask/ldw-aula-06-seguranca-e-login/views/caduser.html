{% extends 'base.html' %}

{% block content %}

{% with messages = get_flashed-messages (with_categories=true) %}
{% for category, message in messages %}
<div class="alert alert-{{category}}">
    {{message}}
</div>
{% endfor %}
{% endwith %}

<div class="container">
    <div class="card mt-4">

        <div class="card-header">
            <h2>Cadastro de Usuários</h2>
        </div>

        <div class="card-body ">
            <form action="{{url_for('caduser')}}" method="POST">
                <label>E-mail: </label>
                <input type="username" name="username" class="form-control" placeholder="Digite seu email">
                <label>Senha: </label>
                <input type="password" name="password" class="form-control" placeholder="Digite sua senha">
                <br>
                <button type="submit" class="btn btn-danger w-100">Cadastrar</button>
                <hr>
                <h6>Já possui conta? <a href="{{url_for('login')}}">Faça Login</a></h6>
            </form>
        </div>
    </div>
</div>

{% endblock content %}
